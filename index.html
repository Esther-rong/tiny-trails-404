<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide-react.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;
const { Menu, X, ArrowLeft } = lucideReact;

function App() {
  const [isMenuOpen, setIsMenuOpen] = useState(false);
  const [scaleY, setScaleY] = useState(1);
  const fourOhFourRef = useRef(null);

  useEffect(() => {
    document.body.style.overflow = isMenuOpen ? 'hidden' : '';
    return () => document.body.style.overflow = '';
  }, [isMenuOpen]);

  const calculateScale = () => {
    if (!fourOhFourRef.current) return;
    const textHeight = fourOhFourRef.current.offsetHeight;
    const newScale = (window.innerHeight / textHeight) * 1.4;
    setScaleY(newScale);
  };

  useEffect(() => {
    calculateScale();
    window.addEventListener('resize', calculateScale);
    return () => window.removeEventListener('resize', calculateScale);
  }, []);

  const navItems = ["About Us", "Programs", "Reviews", "FAQ", "Contacts"];

  return (
    <div className="w-full h-screen overflow-hidden flex flex-col" style={{background: 'linear-gradient(#FF8233, #FDAC55)'}}>
      {/* Background giant 404 + oval */}
      <div className="absolute inset-0 pointer-events-none" style={{
        opacity:0.8,
        WebkitMaskImage:'linear-gradient(to bottom, black 40%, transparent 95%)',
        maskImage:'linear-gradient(to bottom, black 40%, transparent 95%)'
      }}>
        <div className="absolute inset-0 flex items-center justify-center">
          <span ref={fourOhFourRef}
            className="text-white font-black leading-none tracking-tighter whitespace-nowrap inline-block"
            style={{fontSize:'clamp(200px,48vw,800px)', transform:`scale(1.15, ${scaleY * 1.4})`}}>
            404
          </span>
          <div className="absolute rounded-full bg-white h-[22vh] sm:h-[26vh] md:h-[50vh]"
            style={{width:'clamp(120px,20vw,400px)', transform:`scaleY(${scaleY})`, transformOrigin:'center'}}
          />
        </div>
      </div>

      {/* Navbar */}
      <nav className="relative z-20 flex items-center justify-between px-4 sm:px-6 md:px-12 py-4 sm:py-5">
        <div className="flex items-center">
          <div className="grid grid-cols-2 gap-0.5">
            <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
            <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
            <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
            <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
          </div>
          <span className="text-white font-bold text-lg sm:text-xl ml-1">TinyTrails</span>
        </div>

        <div className="hidden md:flex gap-1">
          {navItems.map(item=>(
            <a key={item} href="#" className="px-4 py-1.5 text-sm font-medium rounded-full bg-white text-[#F16524] hover:opacity-90 transition-colors">{item}</a>
          ))}
        </div>

        <button onClick={()=>setIsMenuOpen(true)}
          className="px-4 py-2 sm:px-5 sm:py-2.5 rounded-full text-white bg-[#F16524] hover:opacity-90 transition-colors flex items-center gap-1.5">
          <Menu className="w-4 h-4"/>
          <span className="text-sm font-medium hidden sm:inline">Menu</span>
        </button>
      </nav>

      {/* Mobile overlay menu */}
      <div className={`fixed inset-0 z-50 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${isMenuOpen?'visible':'invisible pointer-events-none'}`}>
        <div onClick={()=>setIsMenuOpen(false)}
          className={`absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-500 ${isMenuOpen?'opacity-100':'opacity-0'}`}/>

        <div className={`absolute top-0 right-0 h-full w-full sm:w-[380px] transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${isMenuOpen?'translate-x-0':'translate-x-full'}`}
          style={{background:'linear-gradient(135deg,#FF6B1A 0%,#FF9642 100%)'}}>
          <div className="p-6 h-full flex flex-col">
            <div className="flex items-center justify-between">
              <div className="flex items-center">
                <div className="grid grid-cols-2 gap-0.5">
                  <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
                  <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
                  <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
                  <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 bg-white rounded-full"></div>
                </div>
                <span className="text-white font-bold text-lg sm:text-xl ml-1">TinyTrails</span>
              </div>
              <button onClick={()=>setIsMenuOpen(false)} className="w-10 h-10 rounded-full bg-white/20 text-white hover:bg-white/30 flex items-center justify-center">
                <X className="w-5 h-5"/>
              </button>
            </div>

            <div className="mt-10 flex flex-col gap-3">
              {navItems.map((item,i)=>(
                <a key={item} href="#" onClick={()=>setIsMenuOpen(false)}
                  className={`px-6 py-4 text-lg font-semibold text-white rounded-2xl bg-white/10 hover:bg-white/20 transition-all duration-300 ${isMenuOpen?'opacity-100 translate-y-0':'opacity-0 translate-y-4'}`}
                  style={{transitionDelay: isMenuOpen ? `${150+i*60}ms` : '0ms'}}>
                  {item}
                </a>
              ))}
            </div>

            <div className={`mt-auto pb-2 transition-all duration-500 ${isMenuOpen?'opacity-100 translate-y-0':'opacity-0 translate-y-4'}`} style={{transitionDelay: isMenuOpen?'450ms':'0ms'}}>
              <a href="/" className="block w-full py-4 rounded-full bg-white font-semibold text-base text-[#F16524] hover:scale-[1.02] transition-transform text-center">
                <span className="inline-flex items-center gap-2 justify-center"><ArrowLeft className="w-4 h-4"/>Back to Home</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      {/* Center video */}
      <div className="absolute inset-0 flex items-center justify-center pointer-events-none" style={{marginTop:'calc(-6vh - 40px)'}}>
        <div className="w-[120vw] h-[85vh] sm:w-[70vw] sm:h-[70vh] md:w-[62vw] md:h-[78vh]">
          <video autoPlay loop muted playsInline className="w-full h-full object-contain pointer-events-none mix-blend-darken"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4"/>
        </div>
      </div>

      {/* Bottom content */}
      <div className="relative z-30 mt-auto pb-8 sm:pb-16 flex flex-col items-center text-center px-4">
        <h1 className="text-white text-lg sm:text-xl md:text-2xl font-medium mb-3 sm:mb-4">Oops, something went wrong!</h1>
        <a href="/" className="inline-flex items-center gap-2 px-6 py-3 sm:px-8 sm:py-4 rounded-full text-white font-semibold text-sm sm:text-base bg-[#F16524] hover:scale-105 hover:shadow-lg transition-all">
          <ArrowLeft className="w-4 h-4 sm:w-5 sm:h-5"/>
          Back to Home
        </a>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
